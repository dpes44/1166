  - url: "https://leanq.com.np"
tags: 
  - name: User
  - description: API for User CRUD Operation

paths:
  /api/auth/guest/login:
    post:
      tags:
        - User
      summary: Returns a Json with user details and token
      description: Anonymous User Login
      requestBody:
        description: Login Anonymous User
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        200:
          description: Success
          schema:
            type: string
            example:
              user: 
                id: "62ed087313542d3a8ce04e86"
                status: "Active"
                roles: ["63527da890113e06ec9965b3"]
                permission: []
                _id: "635415908cc27507f43ce0da"
                username: "guest1234"
                date: "2022-10-22T16:08:48.153Z"
                createdAt: "2022-10-22T16:08:48.162Z"
                updatedAt: "2022-10-22T16:08:48.162Z"
                __v: 0
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Imd1ZXN0MTIzNCIsImlhdCI6MTY2NjQ1NDkyOCwiZXhwIjoxNjczNjU0OTI4fQ.yup7BxIj1-nVlNv2iCI64fndYE6ZTiV-S2BBacGZ0GY"
        400:
          description: User Error
        403:
          description: Error
